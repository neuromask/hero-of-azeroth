  <g id="Layer_2" data-name="Layer 2" class="cls-1">
    <!-- A flask and a hammer, the two things a profession is: a round-bodied bottle with its cork, and a
         smith's hammer standing clear beside it. The two are kept apart on purpose - the flask's neck and the
         hammer's head merge into one blob at icon size if the hammer leans over the bottle. -->
    <circle cx="172" cy="352" r="104" />
    <rect x="136" y="168" width="72" height="104" />
    <rect x="116" y="96" width="112" height="80" rx="30" />
    <g transform="rotate(18 343 254)">
      <rect x="268" y="96" width="150" height="96" rx="18" />
      <rect x="322" y="192" width="44" height="220" rx="22" />
    </g>
  </g>
</svg>
